<!-- Question: Workshop Registration Portal

Create a website in HTML for a “Workshop Registration Portal”.

(a) Display available Workshops in a proper format using Bootstrap.

(b) Create a Workshop Registration Page having the following fields:
- Participant Name
- Username
- Password
- Mobile Number
- City
- Workshop Topic
Generate a list of Cities and Workshop Topics from which the user can select.

(c) Perform the following validations on the registration page using JavaScript:
1. Check whether Participant Name, Username, Password, and Mobile Number are entered or not.
   If not, display the message: "Please enter the required fields."
2. Check whether the Mobile Number contains only digits.
   If not, display the message: "Please enter only digits."
Use HTML, CSS, Bootstrap for styling, and JavaScript for form validation.
-->

<!-- Question: Workshop Registration Portal -->

<!DOCTYPE html>
<html>
<head>
    <title>Workshop Registration Portal</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS -->
    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
        }

        h2 {
            color: blue;
            text-align: center;
        }

        form {
            background-color: white;
            padding: 20px;
            border: 1px solid black;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Available Workshops -->
        <h2>Available Workshops</h2>

        <table class="table table-bordered table-striped">
            <tr class="bg-primary text-white">
                <th>Workshop</th>
                <th>Duration</th>
            </tr>

            <tr>
                <td>Web Development</td>
                <td>2 Days</td>
            </tr>

            <tr>
                <td>Python Programming</td>
                <td>3 Days</td>
            </tr>

            <tr>
                <td>Java Programming</td>
                <td>2 Days</td>
            </tr>
        </table>

        <!-- Registration Form -->
        <h2>Workshop Registration</h2>

        <form onsubmit="return validateForm()">

            <!-- Participant Name -->
            <label>Participant Name:</label>
            <input type="text" id="name" class="form-control">

            <!-- Username -->
            <label>Username:</label>
            <input type="text" id="username" class="form-control">

            <!-- Password -->
            <label>Password:</label>
            <input type="password" id="password" class="form-control">

            <!-- Mobile Number -->
            <label>Mobile Number:</label>
            <input type="text" id="mobile" class="form-control">

            <!-- City -->
            <label>City:</label>
            <select id="city" class="form-control">
                <option value="">Select City</option>
                <option>Surat</option>
                <option>Ahmedabad</option>
                <option>Vadodara</option>
                <option>Rajkot</option>
            </select>

            <!-- Workshop Topic -->
            <label>Workshop Topic:</label>
            <select id="topic" class="form-control">
                <option value="">Select Workshop</option>
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Java Programming</option>
            </select>

            <br>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">
                Register
            </button>

            <button type="reset" class="btn btn-danger">
                Reset
            </button>

        </form>

        <h5 id="result"></h5>

    </div>

    <!-- JavaScript -->
    <script>
        function validateForm() {

            var name = document.getElementById("name").value;
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var mobile = document.getElementById("mobile").value;

            // Required Fields Validation
            if (name == "" || username == "" ||
                password == "" || mobile == "") {

                alert("Please enter the required fields.");
                return false;
            }

            // Mobile Number Validation
            if (isNaN(mobile)) {
                alert("Please enter only digits.");
                return false;
            }

            // Success Message
            document.getElementById("result").innerHTML =
                "Registration Successful!";

            return false;
        }
    </script>

</body>
</html>
