## 📄 FULL QUESTION

### Q.1 Create a website using HTML regarding "Event Ticket Booking System" with following web pages: (20)

**a) Login Page (User/Attendee)**

**b) Registration Page (New User)**

**c) Book Event Ticket Page**

User selects:

1. Event_Name
2. Date
3. Venue
4. Price
5. Number of Tickets
6. Payment Options

**For Styling, use Bootstrap and CSS. Use JavaScript to validate forms.**

### Q.2 VIVA (05)

---

# 🌐 QUESTION OVERVIEW

The main task is to create an **Event Ticket Booking System website**.

The website must contain **3 main web pages**:

### 1. Login Page

Purpose: Existing User/Attendee login.

Main elements:

* Username / Email
* Password
* Login Button

### 2. Registration Page

Purpose: New User registration.

Main elements:

* User details
* Registration fields
* Register Button

### 3. Book Event Ticket Page

Purpose: User books an event ticket.

Required fields:

* Event Name
* Date
* Venue
* Price
* Number of Tickets
* Payment Options
* Booking Button

---

# 🛠️ TECHNOLOGIES REQUIRED

### HTML

Used to create the structure of all web pages.

### CSS

Used for custom styling such as:

* Colors
* Fonts
* Spacing
* Buttons
* Cards
* Page layout

### Bootstrap

Used for:

* Responsive design
* Forms
* Buttons
* Cards
* Navigation
* Grid/layout

### JavaScript

Used for **form validation**.

Example validations:

* Required fields cannot be empty.
* Number of tickets must be valid.
* Payment option must be selected.
* Other necessary input validation.

---

# ⏱️ 2-HOUR SOLVING STRATEGY

## 0–10 Minutes → Basic Setup

* Create project folder.
* Create 3 HTML files.
* Add Bootstrap CDN.
* Create CSS file.
* Create JavaScript file if required.
* Decide the navigation between pages.

---

## 10–30 Minutes → Login Page

Create:

* Page heading
* Username/Email field
* Password field
* Login button
* Bootstrap form/card
* CSS styling
* Navigation to other pages

**Goal:** Complete and working Login Page.

---

## 30–50 Minutes → Registration Page

Create:

* Registration heading
* Required user fields
* Bootstrap form
* Register button
* CSS styling
* Navigation

**Goal:** Complete and working Registration Page.

---

## 50–85 Minutes → Booking Page ⭐

This is the main page.

Create fields for:

* Event Name
* Date
* Venue
* Price
* Number of Tickets
* Payment Options
* Book Ticket button

Use Bootstrap components such as:

* Form controls
* Select/dropdown
* Card
* Buttons
* Grid system

**Goal:** Complete the main booking form.

---

## 85–105 Minutes → JavaScript Validation ⭐

Add JavaScript validation to the forms.

Check:

* Required fields
* Empty fields
* Number of tickets
* Payment option
* Date/input values where required

Display suitable validation messages.

**Important:** Do not completely skip JavaScript because the question specifically asks for form validation.

---

## 105–115 Minutes → Testing

Check every page carefully:

### Login

* Does the page open?
* Does the form look correct?
* Does validation work?

### Registration

* Does the form work?
* Are required fields checked?

### Booking

* Are all 6 required fields present?
* Does the booking button work?
* Does JavaScript validation work?

### Navigation

* Can you move between the pages?

---

## 115–120 Minutes → Final Checking + Viva

Use the last 5 minutes for:

* Checking spelling
* Checking broken links
* Checking HTML structure
* Checking Bootstrap loading
* Checking CSS
* Checking JavaScript
* Saving all files properly

Then prepare for **Viva (5 marks)**.
