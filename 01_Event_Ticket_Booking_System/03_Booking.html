<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket Booking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <style>
        body {
            background-color: lightblue;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .booking-box {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 0px 1px greenyellow;
        }

        h2 {
            color: darkblue;
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="booking-box">

            <h2>Book Event Ticket</h2>

            <form onsubmit="return validateBooking()">
                <div class="form-group">
                    <label>Event Name:</label>
                    <input type="text" id="eventName" class="form-control" placeholder="Enter Event Name">
                </div>

                <div class="form-group">
                    <label>Date:</label>
                    <input type="date" id="eventDate" class="form-control">
                </div>

                <div class="form-group">
                    <label>Venue:</label>
                    <input type="text" id="venue" class="form-control" placeholder="Enter Venue">
                </div>

                <div class="form-group">
                    <label>Price:</label>
                    <input type="number" id="price" class="form-control" placeholder="Enter Ticket Price">
                </div>

                <div class="form-group">
                    <label>Number of Tickets:</label>
                    <input type="number" id="tickets" class="form-control" placeholder="Enter number of Tickets">
                </div>

                <div class="form-group">
                    <label>Payment Options:</label>
                    <select id="payment" class="form-control">
                        <option value="">Select Any 1 Payment Option</option>
                        <option>Cash</option>
                        <option>Credit Card</option>
                        <option>Debit Card</option>
                        <option>UPI</option>
                    </select>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                        Book Ticket
                    </button>
                </div>
            </form>
        </div>

    </div>
    <script>
        function validateBooking() {
            var eventName = document.getElementById("eventName").value;
            var eventDate = document.getElementById("eventDate").value;
            var venue = document.getElementById("venue").value;
            var price = document.getElementById("price").value;
            var tickets = document.getElementById("tickets").value;
            var payment = document.getElementById("payment").value;

            if (eventName == "") {
                alert("Please Enter an Event Name");
                return false;
            }

            if (eventDate == "") {
                alert("Please Select Date");
                return false;
            }

            if (venue == "") {
                alert("Please Enter Venue");
                return false;
            }

            if (price <= 0) {
                alert("Price must be greater than 0");
                return false;
            }

            if (tickets == "") {
                alert("Please Enter Number of Tickets");
                return false;
            }

            if (tickets <= 0) {
                alert("Number of Tickets must be greater than 0");
                return false;
            }

            if (payment == "") {
                alert("Please Select Payment Option");
                return false;
            }

            var totalPayment = price * tickets;
            alert("Total Payment = ₹" + totalPayment);

            alert("Booking Form Submitted Successfully.");
            return false;
        }
    </script>
</body>

</html>
