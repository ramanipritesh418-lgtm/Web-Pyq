<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>

<body>

    <div class="container mt-5">

        <div class="card p-4 w-50 mx-auto">

            <h2 class="text-center mb-4">Student Registration Form</h2>

            <form onsubmit="return validateForm()">

                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="name" class="form-control w-75 mx-auto" placeholder="Enter Name">
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" class="form-control w-75 mx-auto" placeholder="Enter Email">
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="password" class="form-control w-75 mx-auto" placeholder="Enter Password">
                </div>

                <div class="form-group">
                    <label>Gender:</label>

                    <input type="radio" name="gender" value="Male">
                    Male

                    <input type="radio" name="gender" value="Female">
                    Female
                </div>

                <div class="form-group">
                    <label>Hobbies:</label>

                    <input type="checkbox" name="hobby" value="Reading">
                    Reading

                    <input type="checkbox" name="hobby" value="Sports">
                    Sports

                    <input type="checkbox" name="hobby" value="Music">
                    Music
                </div>

                <div class="text-center">

                    <button type="submit" class="btn btn-primary">
                        Submit
                    </button>

                    <button type="reset" class="btn btn-secondary">
                        Reset
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script>

        function validateForm() {

            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;

            if (name == "") {
                alert("Please Enter Name");
                return false;
            }

            if (email == "") {
                alert("Please Enter Email");
                return false;
            }

            if (password.length < 6) {
                alert("Password Must Be At Least 6 Characters");
                return false;
            }

            alert("Registration Successful!");
            return false;
        }

    </script>

</body>

</html>
