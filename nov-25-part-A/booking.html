<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Event Ticket Booking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .booking-box {
            background-color: white;
            width: 450px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input,
        select {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        input[type="submit"] {
            background-color: darkblue;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <div class="booking-box card p-4">

        <h1>Event Ticket Booking System</h1>
        <h2>Book Event Ticket</h2>

        <form onsubmit="return validateBooking()">

            Event Name:
            <select id="event">
                <option value="">Select Event</option>
                <option>Music Concert</option>
                <option>Comedy Show</option>
                <option>Tech Event</option>
            </select>
            <br><br>

            Date:
            <input type="date" id="date">
            <br><br>

            Venue:
            <input type="text" id="venue">
            <br><br>

            Price:
            <input type="number" id="price">
            <br><br>

            Number of Tickets:
            <input type="number" id="tickets">
            <br><br>

            Payment Option:
            <input type="radio" name="payment" value="UPI"> UPI
            <input type="radio" name="payment" value="Credit Card"> Credit Card
            <input type="radio" name="payment" value="Debit Card"> Debit Card
            <br><br>

            <input type="submit" value="Book Ticket" class="btn btn-primary">

        </form>
    </div>

    <script>
        function validateBooking() {

            let event = document.getElementById("event").value;
            let date = document.getElementById("date").value;
            let venue = document.getElementById("venue").value;
            let price = document.getElementById("price").value;
            let tickets = document.getElementById("tickets").value;

            let payment = document.querySelector('input[name="payment"]:checked');

            if (event == "" || date == "" || venue == "" || price == "" || tickets == "") {
                alert("Please fill all fields");
                return false;
            }

            if (price <= 0 || tickets <= 0) {
                alert("Price & Number of Tickets must be greater than 0");
                return false;
            }

            if (payment == null) {
                alert("Please select payment option");
                return false;
            }

            alert("Ticket Booked Successfully");
            return true;
        }
    </script>

</body>

</html>
