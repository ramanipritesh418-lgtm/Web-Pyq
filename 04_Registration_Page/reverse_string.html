<!DOCTYPE html>
<html>

<head>

    <!-- Set the title of the webpage -->
    <title>Reverse String</title>

</head>

<body>

    <!-- Display heading on webpage -->
    <h2>Reverse String</h2>


    <script>

        // Take a string input from the user
        var str = prompt("Enter a string:");


        // Create an empty string to store the reversed string
        var reverse = "";


        // Start the loop from the last character of the string
        // str.length gives the length of the string
        // str.length - 1 gives the last character index
        // i-- decreases the value of i by 1

        for(var i = str.length - 1; i >= 0; i--)
        {

            // Add the current character to the reverse string
            reverse = reverse + str[i];

        }


        // Display the original string
        // <br> moves the output to the next line

        document.write("Original String: " + str + "<br>");


        // Display the reversed string

        document.write("Reverse String: " + reverse);


        /*
        ==============================
                  OUTPUT
        ==============================

        Enter a string: HELLO

        Original String: HELLO
        Reverse String: OLLEH

        ==============================
        */

    </script>

</body>

</html>
