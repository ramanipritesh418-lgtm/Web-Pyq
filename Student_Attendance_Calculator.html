<!-- Q1 (a) Student Attendance Calculator — [20 Marks]

Develop a responsive attendance calculator using HTML form, CSS, Bootstrap 4, and JavaScript.

Accept student's total classes and attended classes record.

On the basis of said inputs, calculate attendance percentage and display Eligibility Status message.

Determine the student's Eligibility Status based on the following criteria:

If attendance percentage is 75% or above, display "Eligible for Examination".

If attendance percentage is below 75%, display "Not Eligible for Examination". -->

<!DOCTYPE html>
<html>

<head>
    <title>Student Attendance Calculator</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: lightgray;
        }

        .box {
            background-color: white;
            padding: 25px;
            margin-top: 50px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-6 box">

                <!-- Page Heading -->
                <h2 class="text-center">
                    Student Attendance Calculator
                </h2>

                <!-- Attendance Form -->
                <form onsubmit="return calculateAttendance()">

                    <!-- Total Classes -->
                    <label>Total Classes:</label>
                    <input type="number" id="total" class="form-control" min="1">

                    <br>

                    <!-- Attended Classes -->
                    <label>Attended Classes:</label>
                    <input type="number" id="attended" class="form-control" min="0">

                    <br>

                    <!-- Calculate Button -->
                    <button type="submit" class="btn btn-primary">
                        Calculate Attendance
                    </button>

                </form>

                <!-- Display Result -->
                <h4 id="result" class="mt-3"></h4>

            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        function calculateAttendance() {

            // Get input values
            var total = Number(document.getElementById("total").value);
            var attended = Number(document.getElementById("attended").value);

            // Validate input values
            if (document.getElementById("total").value == "" ||
                document.getElementById("attended").value == "" ||
                total <= 0 || attended < 0 || attended > total) {

                alert("Please enter valid class details.");
                return false;
            }

            // Calculate attendance percentage
            var percentage = (attended / total) * 100;

            // Check eligibility
            if (percentage >= 75) {

                document.getElementById("result").innerHTML =
                    "Attendance: " + percentage.toFixed(2) +
                    "%<br>Eligible for Examination";

            }
            else {

                document.getElementById("result").innerHTML =
                    "Attendance: " + percentage.toFixed(2) +
                    "%<br>Not Eligible for Examination";

            }

            return false;
        }
    </script>

</body>

</html>
